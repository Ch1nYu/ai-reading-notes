<!DOCTYPE html>
<html lang="zh-Hant-TW" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.tagline }}{% endblock %}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <link rel="icon" href="{{ root }}static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ root }}static/css/site.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      var t = localStorage.getItem("theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
      document.documentElement.classList.add("js");
    })();
  </script>
</head>
<body class="{% block body_class %}{% endblock %}" data-root="{{ root }}">
  <a class="skip-link" href="#main">跳到主要內容</a>
  <div class="progress" aria-hidden="true"><span></span></div>

  <header class="masthead">
    <div class="masthead__inner">
      <a class="wordmark" href="{{ root }}">
        <span class="wordmark__mark" aria-hidden="true">讀</span>
        <span class="wordmark__text">{{ site.title }}</span>
      </a>
      <nav class="masthead__nav" aria-label="主選單">
        <a href="{{ root }}#notes">全部筆記</a>
        <a href="{{ site.repo_url }}" rel="noopener">GitHub</a>
        <button class="theme-toggle" type="button" aria-label="切換深色模式">
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="colophon">
    <div class="colophon__inner">
      <p>{{ site.title }} · 共 {{ notes_total }} 篇 · 更新於 {{ build_date }}</p>
      <p>筆記為個人整理，原文版權屬原作者，請點「閱讀原文」前往來源。</p>
    </div>
  </footer>

  <script src="{{ root }}static/js/site.js" defer></script>
</body>
</html>
